<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Dev</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body data-phase="connecting">
  <header class="bar">
    <span class="brand" data-i18n="app.title">AI Dev</span>
    <nav aria-label="Main">
      <button type="button" data-nav="status" data-i18n="nav.status">Status</button>
      <button type="button" data-nav="wizard" data-i18n="nav.setup">Setup</button>
    </nav>
    <label class="language">
      <span data-i18n="nav.language">Language</span>
      <select id="language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </label>
  </header>
  <main id="screen" tabindex="-1"></main>
</body>
</html>
