# Copy to compose.local.yaml and edit. That file is Git-ignored: it holds local paths.
services:
  ai-dev-mcp:
    volumes:
      - type: bind
        source: ${AI_DEV_PROJECT_PATH:?Set AI_DEV_PROJECT_PATH to a local project or projects directory}
        target: /workspace

      # Dense search with the local BGE-M3 model.
      #
      # The weights are never in the image — they are yours, not the
      # distribution's. Download them once on the host with
      # `npm run model -- install --no-index` (the ONNX export, about 600 MB,
      # lands in ~/.ai-dev/models/bge-m3-onnx; `npm run model -- import` copies
      # it from another machine), then uncomment the four lines below and point
      # AI_DEV_MODEL_PATH at ~/.ai-dev/models — the folder above it, not the
      # model directory itself. The image runs dense search from that mount
      # with no Python at all. (2.x also had a bge-m3/ folder of torch weights
      # for its Python backend; 3.0 removed that backend, and the folder is
      # not read.)
      #
      # Read-only on purpose: the container reads the weights and never writes them.
      # The launchers (docker/run-mcp.sh, run-mcp.ps1 and the Windows Claude proxy
      # ClaudeMcpProxy.cs) do the same mount from the same variable, so every way
      # of starting the image agrees; scripts/model-mount-contract.test.mjs holds
      # them to it.
      # - type: bind
      #   source: ${AI_DEV_MODEL_PATH:?Set AI_DEV_MODEL_PATH to the folder holding bge-m3-onnx/ and/or bge-m3/}
      #   target: /models
      #   read_only: true
