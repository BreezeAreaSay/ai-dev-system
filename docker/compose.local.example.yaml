# Copy to compose.local.yaml and edit. That file is Git-ignored: it holds local paths.
services:
  ai-dev-mcp:
    volumes:
      - type: bind
        source: ${AI_DEV_PROJECT_PATH:?Set AI_DEV_PROJECT_PATH to a local project or projects directory}
        target: /workspace

      # Dense search with the local BGE-M3 model.
      #
      # The weights are never in the image — they are yours, not the
      # distribution's. Download them once on the host with
      # `npm run setup -- --dense` (the ONNX export, about 600 MB, lands in
      # ~/.ai-dev/models/bge-m3-onnx), then uncomment the four lines below and
      # point AI_DEV_MODEL_PATH at ~/.ai-dev/models — the folder above it, not
      # the model directory itself. Both backends live under that one mount:
      # bge-m3-onnx/ for the default and bge-m3/ for the legacy Python weights.
      #
      # The default image can run dense search from that mount with no Python at
      # all. INSTALL_BGE_M3=1 is only needed for the legacy backend:
      #   docker build --build-arg INSTALL_BGE_M3=1 --tag ai-dev-system:bge .docker/build-context
      #   AI_DEV_IMAGE=ai-dev-system:bge docker compose ... run --rm -T ai-dev-mcp
      #
      # Read-only on purpose: the container reads the weights and never writes them.
      # The launcher scripts (docker/run-mcp.sh, run-mcp.ps1) do the same mount from
      # the same variable, so both ways of starting the image agree.
      # - type: bind
      #   source: ${AI_DEV_MODEL_PATH:?Set AI_DEV_MODEL_PATH to the folder holding bge-m3-onnx/ and/or bge-m3/}
      #   target: /models
      #   read_only: true
